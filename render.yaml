services:
  - type: web
    name: theodore-chat-server
    env: node
    rootDir: chat-server
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: ADMIN_KEY
        sync: false
      - key: ALLOWED_ORIGIN
        value: https://cv.theodorenelson.co.za
