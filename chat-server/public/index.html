<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Direct Chat Test</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f1720;
      color: #ecf0f5;
    }
    .shell {
      max-width: 760px;
      margin: 0 auto;
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }
    .panel {
      padding: 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      display: grid;
      gap: 0.6rem;
    }
    .panel-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.6rem;
    }
    input, button {
      font: inherit;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 0.65rem 0.75rem;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }
    button {
      cursor: pointer;
      background: #1e7bd6;
      border-color: #1e7bd6;
      font-weight: 700;
    }
    .status {
      min-height: 1rem;
      color: #a8c5e8;
      margin: 0;
    }
    .messages {
      padding: 1rem;
      overflow: auto;
      display: grid;
      gap: 0.6rem;
      align-content: start;
    }
    .bubble {
      max-width: 75%;
      border-radius: 10px;
      padding: 0.55rem 0.75rem;
      line-height: 1.4;
      background: rgba(255, 255, 255, 0.08);
    }
    .bubble.self {
      justify-self: end;
      background: rgba(30, 123, 214, 0.8);
    }
    .bubble.peer {
      justify-self: start;
    }
    .compose {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.6rem;
      padding: 1rem;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
    }
    @media (max-width: 720px) {
      .panel-grid,
      .compose {
        grid-template-columns: 1fr;
      }
      .bubble {
        max-width: 90%;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <section class="panel">
      <h1 style="margin: 0; font-size: 1.25rem;">Direct Chat Test</h1>
      <div class="panel-grid">
        <input id="name" placeholder="Your name">
        <input id="email" placeholder="Your email">
        <input id="peer-email" placeholder="Recipient email">
        <button id="connect-btn" type="button">Connect</button>
      </div>
      <p class="status" id="status"></p>
    </section>

    <section class="messages" id="messages"></section>

    <form class="compose" id="compose-form">
      <input id="compose-input" placeholder="Type message" autocomplete="off">
      <button type="submit">Send</button>
    </form>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    (function () {
      var socket = null;
      var status = document.getElementById("status");
      var nameInput = document.getElementById("name");
      var emailInput = document.getElementById("email");
      var peerEmailInput = document.getElementById("peer-email");
      var connectBtn = document.getElementById("connect-btn");
      var messagesEl = document.getElementById("messages");
      var composeForm = document.getElementById("compose-form");
      var composeInput = document.getElementById("compose-input");
      var activeConversationKey = "";

      function normalizeEmail(value) {
        return String(value || "").trim().toLowerCase();
      }

      function isValidEmail(value) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(normalizeEmail(value));
      }

      function conversationKey(emailA, emailB) {
        return [normalizeEmail(emailA), normalizeEmail(emailB)].sort().join("::");
      }

      function appendMessage(kind, text) {
        var bubble = document.createElement("div");
        bubble.className = "bubble " + kind;
        bubble.textContent = text;
        messagesEl.appendChild(bubble);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function renderHistory(history) {
        messagesEl.innerHTML = "";
        history.forEach(function (message) {
          appendMessage(
            normalizeEmail(message.fromEmail) === normalizeEmail(emailInput.value) ? "self" : "peer",
            message.senderName + ": " + message.text
          );
        });
      }

      connectBtn.addEventListener("click", function () {
        var name = nameInput.value.trim();
        var email = normalizeEmail(emailInput.value);
        var peerEmail = normalizeEmail(peerEmailInput.value);

        if (!name || !isValidEmail(email) || !isValidEmail(peerEmail)) {
          status.textContent = "Name, your email, and recipient email are required.";
          return;
        }

        activeConversationKey = conversationKey(email, peerEmail);
        socket = io();

        socket.on("connect", function () {
          status.textContent = "Connected. Authenticating...";
          socket.emit("auth:login", { name: name, email: email });
        });

        socket.on("auth:ok", function () {
          status.textContent = "Connected live to " + peerEmail + ".";
          socket.emit("chat:history", { peerEmail: peerEmail });
        });

        socket.on("chat:history", function (payload) {
          if (payload.conversationKey === activeConversationKey) {
            renderHistory(payload.history || []);
          }
        });

        socket.on("chat:message", function (message) {
          if (message.conversationKey !== activeConversationKey) {
            return;
          }
          appendMessage(
            normalizeEmail(message.fromEmail) === email ? "self" : "peer",
            message.senderName + ": " + message.text
          );
        });

        socket.on("chat:error", function (payload) {
          status.textContent = payload.message || "Chat error.";
        });

        socket.on("auth:error", function (payload) {
          status.textContent = payload.message || "Authentication failed.";
        });
      });

      composeForm.addEventListener("submit", function (event) {
        event.preventDefault();
        var text = composeInput.value.trim();
        var peerEmail = normalizeEmail(peerEmailInput.value);
        if (!socket || !text || !isValidEmail(peerEmail)) {
          return;
        }
        socket.emit("chat:send", { targetEmail: peerEmail, text: text });
        composeInput.value = "";
      });
    })();
  </script>
</body>
</html>
