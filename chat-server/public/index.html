<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Automation Admin</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07111b;
      --panel: #0f1c29;
      --panel-strong: #16283b;
      --line: rgba(255, 255, 255, 0.12);
      --text: #eaf2fb;
      --muted: #9ab0c7;
      --accent: #53b3ff;
      --accent-strong: #1176c9;
      --ok: #79d27c;
      --warn: #ffcf70;
      --danger: #ff8f8f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at top right, rgba(83, 179, 255, 0.18), transparent 28%),
        linear-gradient(180deg, #07111b 0%, #091520 100%);
      color: var(--text);
    }

    .shell {
      width: min(1180px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 1.25rem 0 2rem;
    }

    .topbar {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .topbar h1 {
      margin: 0;
      font-size: 1.5rem;
      letter-spacing: 0.01em;
    }

    .topbar p {
      margin: 0.2rem 0 0;
      color: var(--muted);
    }

    .toolbar {
      display: flex;
      gap: 0.65rem;
      flex-wrap: wrap;
      align-items: center;
    }

    input,
    button {
      font: inherit;
      border-radius: 12px;
      border: 1px solid var(--line);
      padding: 0.72rem 0.9rem;
    }

    input {
      min-width: 240px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
    }

    button {
      cursor: pointer;
      color: #fff;
      background: linear-gradient(135deg, var(--accent-strong), var(--accent));
      border-color: transparent;
      font-weight: 700;
    }

    button.secondary {
      background: rgba(255, 255, 255, 0.07);
      border-color: var(--line);
      color: var(--text);
      font-weight: 600;
    }

    .status {
      margin: 0 0 1rem;
      min-height: 1.2rem;
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 1rem;
    }

    .column {
      display: grid;
      gap: 1rem;
      align-content: start;
    }

    .panel {
      background: linear-gradient(180deg, rgba(22, 40, 59, 0.94), rgba(15, 28, 41, 0.94));
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 1rem;
      box-shadow: 0 20px 36px rgba(0, 0, 0, 0.18);
    }

    .panel h2 {
      margin: 0 0 0.85rem;
      font-size: 1rem;
      letter-spacing: 0.02em;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.8rem;
    }

    .stat {
      padding: 0.95rem;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .stat .label {
      display: block;
      color: var(--muted);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.4rem;
    }

    .stat .value {
      font-size: 1.6rem;
      font-weight: 700;
    }

    .list {
      display: grid;
      gap: 0.7rem;
    }

    .card {
      padding: 0.85rem 0.9rem;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .card strong {
      display: block;
      margin-bottom: 0.25rem;
    }

    .meta {
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.45;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 0.2rem 0.55rem;
      margin-right: 0.35rem;
      font-size: 0.75rem;
      background: rgba(83, 179, 255, 0.12);
      color: var(--accent);
      border: 1px solid rgba(83, 179, 255, 0.18);
    }

    .event-type {
      color: var(--warn);
    }

    .empty {
      color: var(--muted);
      padding: 0.25rem 0;
    }

    @media (max-width: 980px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 720px) {
      .shell {
        width: min(100%, calc(100% - 1rem));
      }

      .stats {
        grid-template-columns: 1fr 1fr;
      }

      input {
        min-width: 0;
        width: 100%;
      }

      .toolbar {
        width: 100%;
      }
    }

    @media (max-width: 520px) {
      .stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <h1>Portfolio Automation Admin</h1>
        <p>Live view for contact, CV, diploma, certificate, and project interaction events.</p>
      </div>
      <div class="toolbar">
        <input id="admin-key" type="password" placeholder="Admin key if required">
        <button id="load-btn" type="button">Load Dashboard</button>
        <button id="refresh-btn" type="button" class="secondary">Refresh</button>
      </div>
    </header>

    <p id="status" class="status">Ready.</p>

    <div class="grid">
      <div class="column">
        <section class="panel">
          <h2>Totals</h2>
          <div class="stats" id="totals"></div>
        </section>

        <section class="panel">
          <h2>Recent Events</h2>
          <div class="list" id="recent-events"></div>
        </section>
      </div>

      <div class="column">
        <section class="panel">
          <h2>Top Leads</h2>
          <div class="list" id="leads"></div>
        </section>

        <section class="panel">
          <h2>Projects</h2>
          <div class="list" id="projects"></div>
        </section>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var adminKeyInput = document.getElementById("admin-key");
      var loadBtn = document.getElementById("load-btn");
      var refreshBtn = document.getElementById("refresh-btn");
      var statusEl = document.getElementById("status");
      var totalsEl = document.getElementById("totals");
      var recentEventsEl = document.getElementById("recent-events");
      var leadsEl = document.getElementById("leads");
      var projectsEl = document.getElementById("projects");
      var adminKeyStorageKey = "portfolio-admin-key";
      var refreshTimer = null;

      function setStatus(text, tone) {
        statusEl.textContent = text;
        statusEl.style.color =
          tone === "error" ? "var(--danger)" :
          tone === "ok" ? "var(--ok)" :
          "var(--muted)";
      }

      function getAdminKey() {
        return String(adminKeyInput.value || "").trim();
      }

      function saveAdminKey() {
        try {
          localStorage.setItem(adminKeyStorageKey, getAdminKey());
        } catch (_err) {
          // Ignore storage failures.
        }
      }

      function loadSavedAdminKey() {
        try {
          var saved = localStorage.getItem(adminKeyStorageKey) || "";
          adminKeyInput.value = saved;
        } catch (_err) {
          adminKeyInput.value = "";
        }
      }

      function createEmptyState(message) {
        var el = document.createElement("div");
        el.className = "empty";
        el.textContent = message;
        return el;
      }

      function renderTotals(totals) {
        totalsEl.innerHTML = "";
        var cards = [
          ["All Events", totals.events || 0],
          ["Contacts", totals.contactSubmissions || 0],
          ["CV Downloads", totals.cvDownloads || 0],
          ["Diploma Downloads", totals.diplomaDownloads || 0],
          ["Certificate Downloads", totals.certificateDownloads || 0],
          ["Project Views", totals.projectViews || 0]
        ];

        cards.forEach(function (entry) {
          var card = document.createElement("div");
          card.className = "stat";
          card.innerHTML =
            '<span class="label">' + entry[0] + '</span>' +
            '<span class="value">' + entry[1] + '</span>';
          totalsEl.appendChild(card);
        });
      }

      function renderLeads(leads) {
        leadsEl.innerHTML = "";
        if (!leads || leads.length === 0) {
          leadsEl.appendChild(createEmptyState("No lead activity yet."));
          return;
        }

        leads.forEach(function (lead) {
          var card = document.createElement("div");
          card.className = "card";
          card.innerHTML =
            "<strong>" + escapeHtml(lead.name || lead.email || lead.id || "Anonymous visitor") + "</strong>" +
            '<div class="meta">' +
            '<span class="pill">Score ' + Number(lead.score || 0) + "</span>" +
            '<span class="pill">Stage ' + escapeHtml(lead.stage || "unknown") + "</span>" +
            "<div>" + escapeHtml(lead.email || "No email captured") + "</div>" +
            "<div>Contacts: " + Number(lead.contactSubmissions || 0) +
            " | CV: " + Number(lead.cvDownloads || 0) +
            " | Diplomas: " + Number(lead.diplomaDownloads || 0) +
            " | Certificates: " + Number(lead.certificateDownloads || 0) + "</div>" +
            "<div>Last seen: " + escapeHtml(formatDate(lead.lastSeenAt)) + "</div>" +
            "</div>";
          leadsEl.appendChild(card);
        });
      }

      function renderProjects(projects) {
        projectsEl.innerHTML = "";
        if (!projects || projects.length === 0) {
          projectsEl.appendChild(createEmptyState("No project activity yet."));
          return;
        }

        projects.forEach(function (project) {
          var card = document.createElement("div");
          card.className = "card";
          card.innerHTML =
            "<strong>" + escapeHtml(project.name || project.slug || "Unnamed project") + "</strong>" +
            '<div class="meta">' +
            "<div>Views: " + Number(project.views || 0) + " | Opens: " + Number(project.opens || 0) + "</div>" +
            "<div>Last viewed: " + escapeHtml(formatDate(project.lastViewedAt)) + "</div>" +
            "<div>Last opened: " + escapeHtml(formatDate(project.lastOpenedAt)) + "</div>" +
            "</div>";
          projectsEl.appendChild(card);
        });
      }

      function renderRecentEvents(events) {
        recentEventsEl.innerHTML = "";
        if (!events || events.length === 0) {
          recentEventsEl.appendChild(createEmptyState("No events captured yet."));
          return;
        }

        events.forEach(function (event) {
          var subject = event.contact && (event.contact.name || event.contact.email)
            ? (event.contact.name || event.contact.email)
            : event.project && event.project.name
              ? event.project.name
              : event.asset && event.asset.label
                ? event.asset.label
                : "Portfolio interaction";
          var card = document.createElement("div");
          card.className = "card";
          card.innerHTML =
            '<strong><span class="event-type">' + escapeHtml(event.type || "unknown") + "</span></strong>" +
            '<div class="meta">' +
            "<div>" + escapeHtml(subject) + "</div>" +
            "<div>" + escapeHtml(formatDate(event.timestamp)) + "</div>" +
            "<div>" + escapeHtml(event.page || event.referrer || "") + "</div>" +
            "</div>";
          recentEventsEl.appendChild(card);
        });
      }

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function formatDate(value) {
        if (!value) {
          return "Not available";
        }
        var date = new Date(value);
        if (Number.isNaN(date.getTime())) {
          return String(value);
        }
        return date.toLocaleString();
      }

      function buildHeaders() {
        var headers = {};
        var adminKey = getAdminKey();
        if (adminKey) {
          headers["x-admin-key"] = adminKey;
        }
        return headers;
      }

      function fetchSummary() {
        saveAdminKey();
        setStatus("Loading dashboard...");

        fetch("/api/automation/summary", {
          headers: buildHeaders()
        })
          .then(function (response) {
            if (!response.ok) {
              return response.json().catch(function () {
                return {};
              }).then(function (payload) {
                var message = payload.error || ("Request failed with status " + response.status + ".");
                throw new Error(message);
              });
            }
            return response.json();
          })
          .then(function (summary) {
            renderTotals(summary.totals || {});
            renderLeads(summary.leads || []);
            renderProjects(summary.projects || []);
            renderRecentEvents(summary.recentEvents || []);
            setStatus("Dashboard updated at " + new Date().toLocaleTimeString(), "ok");
          })
          .catch(function (error) {
            setStatus(error.message || "Could not load dashboard.", "error");
          });
      }

      function startAutoRefresh() {
        if (refreshTimer) {
          clearInterval(refreshTimer);
        }
        refreshTimer = setInterval(fetchSummary, 15000);
      }

      loadBtn.addEventListener("click", fetchSummary);
      refreshBtn.addEventListener("click", fetchSummary);
      adminKeyInput.addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
          fetchSummary();
        }
      });

      loadSavedAdminKey();
      renderTotals({});
      renderLeads([]);
      renderProjects([]);
      renderRecentEvents([]);
      startAutoRefresh();
    })();
  </script>
</body>
</html>
