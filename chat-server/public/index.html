<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Admin Console</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f1720;
      color: #ecf0f5;
    }
    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: 100vh;
    }
    .panel {
      border-right: 1px solid rgba(255, 255, 255, 0.12);
      padding: 1rem;
      background: #101b29;
    }
    .main {
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 100vh;
    }
    .row {
      display: grid;
      gap: 0.6rem;
      margin-bottom: 0.6rem;
    }
    input, button {
      font: inherit;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 0.55rem 0.7rem;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }
    button {
      cursor: pointer;
      background: #1e7bd6;
      border-color: #1e7bd6;
      font-weight: 700;
    }
    .status {
      font-size: 0.88rem;
      color: #a8c5e8;
      min-height: 1rem;
    }
    .users {
      display: grid;
      gap: 0.45rem;
    }
    .user-btn {
      text-align: left;
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 255, 255, 0.16);
    }
    .user-btn.active {
      border-color: #1e7bd6;
      background: rgba(30, 123, 214, 0.3);
    }
    .messages {
      padding: 1rem;
      overflow: auto;
      display: grid;
      gap: 0.6rem;
      align-content: start;
    }
    .bubble {
      max-width: 70%;
      border-radius: 10px;
      padding: 0.55rem 0.7rem;
      line-height: 1.35;
      background: rgba(255, 255, 255, 0.08);
    }
    .bubble.visitor {
      justify-self: start;
    }
    .bubble.admin {
      justify-self: end;
      background: rgba(30, 123, 214, 0.8);
    }
    .compose {
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      padding: 0.85rem;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.5rem;
    }
    @media (max-width: 850px) {
      .layout {
        grid-template-columns: 1fr;
      }
      .panel {
        border-right: 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      }
      .bubble {
        max-width: 88%;
      }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="panel">
      <h2>Admin Login</h2>
      <div class="row">
        <input id="admin-name" placeholder="Name" value="Theodore">
        <input id="admin-email" placeholder="Email">
        <input id="admin-key" placeholder="Admin key">
        <button id="connect-btn" type="button">Connect</button>
      </div>
      <p class="status" id="status"></p>
      <h3>Visitors</h3>
      <div class="users" id="users"></div>
    </aside>

    <section class="main">
      <div style="padding: 0.9rem 1rem; border-bottom: 1px solid rgba(255,255,255,0.12);">
        <strong id="active-user-title">No visitor selected</strong>
      </div>
      <div class="messages" id="messages"></div>
      <form class="compose" id="compose-form">
        <input id="compose-input" placeholder="Type reply..." autocomplete="off">
        <button type="submit">Send</button>
      </form>
    </section>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    (function () {
      var socket = null;
      var status = document.getElementById("status");
      var connectBtn = document.getElementById("connect-btn");
      var usersEl = document.getElementById("users");
      var messagesEl = document.getElementById("messages");
      var composeForm = document.getElementById("compose-form");
      var composeInput = document.getElementById("compose-input");
      var activeUserTitle = document.getElementById("active-user-title");
      var activeUserId = "";
      var onlineUsers = new Map();
      var histories = new Map();

      function renderUsers() {
        usersEl.innerHTML = "";
        Array.from(onlineUsers.values()).forEach(function (user) {
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "user-btn" + (user.userId === activeUserId ? " active" : "");
          btn.textContent = user.name + " (" + user.email + ")";
          btn.addEventListener("click", function () {
            activeUserId = user.userId;
            activeUserTitle.textContent = "Chat with " + user.name;
            if (socket) {
              socket.emit("chat:history", { userId: user.userId });
            }
            renderUsers();
          });
          usersEl.appendChild(btn);
        });
      }

      function renderMessages() {
        messagesEl.innerHTML = "";
        var history = histories.get(activeUserId) || [];
        history.forEach(function (item) {
          var bubble = document.createElement("div");
          bubble.className = "bubble " + item.senderRole;
          bubble.textContent = item.senderName + ": " + item.text;
          messagesEl.appendChild(bubble);
        });
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function upsertHistory(message) {
        var arr = histories.get(message.userId) || [];
        arr.push(message);
        if (arr.length > 200) arr.shift();
        histories.set(message.userId, arr);
      }

      connectBtn.addEventListener("click", function () {
        var name = document.getElementById("admin-name").value.trim();
        var email = document.getElementById("admin-email").value.trim();
        var adminKey = document.getElementById("admin-key").value.trim();

        if (!name || !email || !adminKey) {
          status.textContent = "Name, email and admin key are required.";
          return;
        }

        socket = io();
        socket.on("connect", function () {
          status.textContent = "Connected. Authenticating...";
          socket.emit("auth:login", { role: "admin", name: name, email: email, adminKey: adminKey });
        });

        socket.on("auth:error", function (payload) {
          status.textContent = payload.message || "Login failed.";
        });

        socket.on("auth:ok", function (payload) {
          status.textContent = "Admin connected.";
          (payload.onlineVisitors || []).forEach(function (u) {
            onlineUsers.set(u.userId, u);
          });
          renderUsers();
        });

        socket.on("admin:user-online", function (user) {
          onlineUsers.set(user.userId, user);
          renderUsers();
        });

        socket.on("admin:user-offline", function (payload) {
          onlineUsers.delete(payload.userId);
          renderUsers();
        });

        socket.on("chat:message", function (message) {
          upsertHistory(message);
          if (!activeUserId) {
            activeUserId = message.userId;
            var user = onlineUsers.get(activeUserId);
            activeUserTitle.textContent = user ? "Chat with " + user.name : "Chat active";
          }
          if (message.userId === activeUserId) {
            renderMessages();
          }
        });

        socket.on("admin:history", function (payload) {
          histories.set(payload.userId, payload.history || []);
          if (payload.userId === activeUserId) {
            renderMessages();
          }
        });
      });

      composeForm.addEventListener("submit", function (event) {
        event.preventDefault();
        var text = composeInput.value.trim();
        if (!socket || !activeUserId || !text) {
          return;
        }
        socket.emit("chat:send", { targetUserId: activeUserId, text: text });
        composeInput.value = "";
      });
    })();
  </script>
</body>
</html>
